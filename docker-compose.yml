version: "3.3"
services:
  image-search-api:
    build: .
    ports:
      - "8080:8080"
      # - "8000:8000" # debug
      # - "9010:9010" # debug
    environment:
      SOLR_SERVER: http://p44.arquivo.pt:8983/solr/
      SOLR_COLLECTION: images
      WAYBACK_HOST: arquivo.pt/wayback/wayback
      LINK_TO_SERVICE: https://arquivo.pt/images.jsp
      WAYBACK_ADDRESS: https://arquivo.pt/wayback/
      # enable debug mode:
      # CATALINA_OPTS: -agentlib:jdwp=transport=dt_socket,address=8000,server=y,suspend=n -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false
