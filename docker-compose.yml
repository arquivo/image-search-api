services:
  image-search-api:
    build: .
    network_mode: host
    ports:
      - "8080:8080"
      - "8000:8000" # used for debug
      - "9010:9010" # used for debug
    environment:
      # Debug/JMX flags, on top of the Dockerfile's default JAVA_OPTS (GC +
      # heap sizing), since this fully replaces JAVA_OPTS rather than appending to it.
      JAVA_OPTS: -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError -agentlib:jdwp=transport=dt_socket,address=8000,server=y,suspend=n -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false
    healthcheck:
      # Bare TCP connect, not a full HTTP request - every path here is mapped to the
      # search servlet, so any HTTP request would trigger a real Solr query. This only
      # confirms Tomcat itself is up and accepting connections on 8080.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
