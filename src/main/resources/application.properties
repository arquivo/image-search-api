# If more configurations are added here, remember to update the fail-safe configs on ImageSearchConfigs.java
linkToService=https://dev.arquivo.pt/images.jsp
waybackAddress=https://dev.arquivo.pt/wayback/

# Timeouts for the /imagesearch/healthcheck ping to Solr, kept short so a hanging Solr fails the
# check quickly instead of blocking whatever deploy gate is polling it
healthcheck.solr.connectiontimeout.ms=2000
healthcheck.solr.sockettimeout.ms=3000